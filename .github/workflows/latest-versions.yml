name: App version checks

on:
    schedule: # Once a day.
        -   cron: "0 6 * * *"
    workflow_run:
        workflows:
            - Release
        branches:
            - main
        types:
            - completed
    workflow_dispatch:
        inputs:
            package:
                description: "Only check this package id (default: all packages)"
                required: false
                default: ""

permissions:
    contents: read
    issues: write

jobs:
    check:
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/reseam/ci:2026.10.19
        defaults:
            run:
                shell: bash

        env:
            SNIFF_BASE_URL: https://sniff.madkarma.top/v2
            PACKAGE_NAME: ${{ inputs.package }}
            BUNDLE_SIGNING_KEY_B64: ${{ secrets.BUNDLE_SIGNING_KEY_B64 }}
            RESEAM_HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    ref: ${{ github.event.workflow_run.head_sha || github.sha }}

            -   name: Cache dependencies
                uses: actions/cache@v6
                with:
                    path: |
                        ~/.gradle/caches
                        ~/.gradle/wrapper
                    key: deps-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'bun.lock') }}
                    restore-keys: deps-${{ runner.os }}-

            -   name: Set up UV
                uses: astral-sh/setup-uv@v10.1.0
                with:
                    python-version: "3.14"

            -   name: Install GitHub CLI
                env:
                    GH_VERSION: "2.102.0"
                run: |
                    curl -fsSL "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
                    echo "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"

            -   name: Generate patches.json
                id: patches-json
                run: just index

            -   name: Update latest-versions sticky issue
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    args=()
                    if [ -n "$PACKAGE_NAME" ]; then args+=(--package "$PACKAGE_NAME"); fi
                    uv run .github/scripts/track_latest_versions.py "${args[@]}"

            -   name: Check compatibility bumps
                if: ${{ !cancelled() && steps.patches-json.outcome == 'success' }}
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    args=()
                    if [ -n "$PACKAGE_NAME" ]; then args+=(--package "$PACKAGE_NAME"); fi
                    uv run .github/scripts/compatibility_bump_notifier.py "${args[@]}"
